name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      # Pin third-party actions to immutable commit SHAs. The comments record the
      # major tag that was intentionally resolved when this workflow was updated.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Package Windows builds
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $releaseArgs = @('release', 'create', $tag, 'dist/*.zip', 'dist/SHA256SUMS.txt', '--generate-notes', '--title', "Native Widget $tag")
          if ($tag -match '-') { $releaseArgs += '--prerelease' }
          gh @releaseArgs
