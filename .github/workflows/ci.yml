name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build NativeWidget/NativeWidget.csproj -c Release --nologo
      - name: Structural and persistence smoke tests
        run: dotnet run --project NativeWidget.RoundTripTests/NativeWidget.RoundTripTests.csproj -c Release
