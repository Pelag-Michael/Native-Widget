name: Bug report
description: Report reproducible behavior in Native Widget
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove credentials and personal content from screenshots and logs before submitting."
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit hash
      placeholder: v0.1.0-alpha
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: widget
    attributes:
      label: Widget
      options: [Launcher, Calendar, Tasks, Notes, Timers, Focus, Translate, Projects, Settings, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open …\n2. Click …\n3. Observe …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized logs
