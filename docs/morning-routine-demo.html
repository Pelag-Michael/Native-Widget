<style>body{font-family:'Aptos','Segoe UI Variable Text','Segoe UI',sans-serif}h1,h2{font-family:'Bahnschrift','Aptos','Segoe UI',sans-serif}.event strong{font-weight:600}.task{font-size:13px}</style>
<div class="desktop" aria-hidden="true"></div><div id="shade"></div><div class="cards" id="cards" aria-hidden="true"></div>
<main class="stage"><section class="board" id="board" aria-label="Daily plan">
<header class="header"><div class="headrow"><div><h1 id="heading">Today</h1><p class="date" id="date"></p></div><div class="header-actions"><button id="week-open">Week ↗</button><button id="settings-open">Settings</button><button class="icon" id="close" aria-label="Close daily plan">×</button></div></div><nav class="days" id="days" aria-label="Day"></nav></header>
<div class="body"><section class="schedule" aria-label="Schedule"><div id="timeline" class="day-timeline"></div></section><section class="tasks"><div class="section-title"><h2>To do</h2><span class="progress" id="progress"></span><button id="edit-open">Edit</button></div><div id="checklist"></div></section></div>
<footer class="footer"><span class="mono muted" id="reminder-label"></span><div class="actions"><button id="skip" class="quiet">Dismiss</button><button id="snooze">Snooze 10m</button><button id="start" class="primary">Start day ↗</button></div></footer>
</section></main>
<aside class="controls" aria-label="Demo controls"><small>PREVIEW</small><button id="reopen">Show plan</button><button id="simulate">Test in 5s</button><button id="cards-open">Background cards</button></aside><div id="toast" class="toast" role="status" hidden></div>
<dialog id="settings"><div class="dialog-head"><h2>Settings</h2><button class="icon" data-close="settings" aria-label="Close settings">×</button></div><div class="dialog-tabs"><button data-tab="general" class="active">General</button><button data-tab="background">Background cards</button></div>
<section id="tab-general"><label class="field">Time<input type="time" id="reminder" aria-label="Reminder time"></label><label class="field">Background dimming<input type="range" id="dim" min="0" max="90"></label><p class="hint">This HTML preview stores your settings locally. Scheduled launch is not connected to Windows.</p></section>
<section id="tab-background" hidden><div class="row"><span id="card-count" class="muted"></span><button id="shuffle">Shuffle layout</button></div><p class="hint">Add text or images. Cards stay outside the plan and resize to fit the available space.</p><div class="card-form"><textarea id="new-card" placeholder="A note, reminder, or something worth keeping in sight…" aria-label="New text card"></textarea><div class="row"><button id="add-text">Add text</button><label class="file-label">Add images<input type="file" id="images" accept="image/*" multiple></label></div></div><div id="card-manager" class="card-manager"></div></section>
</dialog>
<dialog id="editor"><div class="dialog-head"><h2 id="editor-title">Edit routine</h2><button class="icon" data-close="editor" aria-label="Cancel editing">×</button></div><form id="editor-form"><div id="editrows"></div><div class="edit-footer"><button id="add-block" type="button">+ Add block</button><button type="submit" class="primary">Save routine</button></div></form></dialog>
<dialog id="week" class="week-dialog"><div class="dialog-head"><h2>Weekly routine</h2><button class="icon" data-close="week" aria-label="Close weekly routine">×</button></div><div class="week-scroll"><div class="week-head" id="week-head"></div><div class="week-grid" id="week-grid"></div></div><p class="week-note">Select a block to open its day.</p></dialog>
<script id="schedule-data" type="application/json">{"mon":[{"c":"work","e":"11:00","s":"09:00","id":"mon-example-1","t":"Example focus block"},{"c":"grow","e":"15:00","s":"14:00","id":"mon-example-2","t":"Example learning block"}],"wed":[{"c":"work","e":"11:00","s":"09:00","id":"wed-example-1","t":"Example focus block"},{"c":"grow","e":"15:00","s":"14:00","id":"wed-example-2","t":"Example learning block"}],"sat":[{"c":"work","e":"11:00","s":"09:00","id":"sat-example-1","t":"Example focus block"},{"c":"grow","e":"15:00","s":"14:00","id":"sat-example-2","t":"Example learning block"}],"thu":[{"c":"work","e":"11:00","s":"09:00","id":"thu-example-1","t":"Example focus block"},{"c":"grow","e":"15:00","s":"14:00","id":"thu-example-2","t":"Example learning block"}],"tue":[{"c":"work","e":"11:00","s":"09:00","id":"tue-example-1","t":"Example focus block"},{"c":"grow","e":"15:00","s":"14:00","id":"tue-example-2","t":"Example learning block"}],"sun":[{"c":"work","e":"11:00","s":"09:00","id":"sun-example-1","t":"Example focus block"},{"c":"grow","e":"15:00","s":"14:00","id":"sun-example-2","t":"Example learning block"}],"fri":[{"c":"work","e":"11:00","s":"09:00","id":"fri-example-1","t":"Example focus block"},{"c":"grow","e":"15:00","s":"14:00","id":"fri-example-2","t":"Example learning block"}]}</script>
<script>
'use strict';
const $=id=>document.getElementById(id), days=['mon','tue','wed','thu','fri','sat','sun'], names=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'], short=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const cats={work:{label:'Work',color:'#9fb4d2'},grow:{label:'Growth',color:'#d4bd8e'},play:{label:'Rest',color:'#9fbda9'},frame:{label:'Personal',color:'#a8b1a5'},study:{label:'Study',color:'#d3a09a'}};
const initial=JSON.parse($('schedule-data').textContent),key='nativewidget-morning-html-demo-v2';let saved={},legacy={};try{legacy=JSON.parse(localStorage.getItem('nativewidget-morning-html-demo-v1')||'{}');saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
const english=b=>b.t;
const samples={work:['Choose the main priority','Complete a focused work session'],grow:['Study or practise one topic','Write down what you learned'],study:['Prepare laptop and materials','Review the class notes'],frame:['Prepare for the day'],play:['Take a break']};
let schedule=saved.schedule||legacy.schedule||structuredClone(initial),completed=saved.completed||legacy.completed||{},day=days[(new Date().getDay()+6)%7],draft=[],reminderTimer,countdown,toastTimer,layoutSeed=saved.layoutSeed||1;
const translations={'Chọn một việc quan trọng nhất':'Choose the main priority','Hoàn thành một phiên tập trung':'Complete a focused work session','Học hoặc luyện tập một chủ đề':'Study or practise one topic','Ghi lại điều đã học':'Write down what you learned','Chuẩn bị laptop và tài liệu':'Prepare laptop and materials','Xem lại nội dung buổi học':'Review the class notes','Chuẩn bị cho ngày mới':'Prepare for the day','Dành thời gian nghỉ ngơi':'Take a break'};
for(const d of days)for(const b of schedule[d]){const original=initial[d].find(x=>x.id===b.id);if(original&&b.t===original.t)b.t=english(original);if(!Array.isArray(b.tasks))b.tasks=(samples[b.c]||[]).map((text,i)=>({id:b.id+'-task-'+i,text}));else if(!saved.schedule)b.tasks=b.tasks.map(t=>({...t,text:translations[t.text]||t.text}));}
let cards=saved.cards||[{id:'sample-text-1',type:'text',text:'One clear priority.\nThen the next.',color:'#dbdecc'},{id:'sample-text-2',type:'text',text:'Keep in view\n\nYour important notes can live here.',color:'#c5d0c8'},{id:'sample-text-3',type:'text',text:'Space for ideas.\nImages. References. Reminders.',color:'#d9ccb9'}];
$('reminder').value=saved.reminder||legacy.reminder||'06:45';$('dim').value=saved.dim??legacy.dim??60;
function persist(){try{localStorage.setItem(key,JSON.stringify({schedule,completed,cards,layoutSeed,reminder:$('reminder').value,dim:Number($('dim').value)}));return true}catch{toast('Storage is full. Remove a card or use a smaller image.');return false}}
const make=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function shownDate(d=day){const now=new Date();now.setDate(now.getDate()+days.indexOf(d)-(now.getDay()+6)%7);return now}
const doneKey=id=>dateKey(shownDate())+':'+id, minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
function range(){const blocks=Object.values(schedule).flat();return {start:Math.floor(Math.min(360,...blocks.map(b=>minutes(b.s)))/60)*60,end:Math.ceil(Math.max(1380,...blocks.map(b=>minutes(b.e)))/60)*60}}
function addHours(parent,start,end,px,labels=true){for(let m=start;m<=end;m+=60){const line=make('div','hour');line.style.top=(m-start)/60*px+'px';if(labels)line.append(make('span','',String(Math.floor(m/60)).padStart(2,'0')+':00'));parent.append(line)}}
function event(b,start,px,onClick){const n=make('button','event'+((minutes(b.e)-minutes(b.s))*px/60<43?' short':''));n.style.setProperty('--accent',(cats[b.c]||cats.frame).color);n.style.top=(minutes(b.s)-start)*px/60+'px';n.style.height=Math.max(5,(minutes(b.e)-minutes(b.s))*px/60-2)+'px';n.title=b.s+'–'+b.e+' · '+b.t;n.append(make('time','',b.s+'–'+b.e),make('strong','',b.t));n.onclick=onClick;return n}
function render(){
 const date=shownDate(),today=dateKey(date)===dateKey(new Date());$('heading').textContent=today?'Today':names[days.indexOf(day)];$('date').textContent=date.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});$('reminder-label').textContent=$('reminder').value;
 $('days').replaceChildren();days.forEach((d,i)=>{const b=make('button',d===day?'active':'',short[i]);b.setAttribute('aria-label',names[i]);b.setAttribute('aria-pressed',d===day);b.onclick=()=>{day=d;render()};$('days').append(b)});
 const {start,end}=range(),px=40;$('timeline').replaceChildren();$('timeline').style.height=(end-start)/60*px+'px';addHours($('timeline'),start,end,px);$('checklist').replaceChildren();let total=0,done=0;
 schedule[day].forEach(b=>{
  const block=event(b,start,px,()=>{document.querySelectorAll('#timeline .event').forEach(n=>n.classList.remove('selected'));block.classList.add('selected');$('group-'+b.id)?.scrollIntoView({behavior:'smooth',block:'nearest'})});$('timeline').append(block);
  const group=make('section','group');group.id='group-'+b.id;group.style.setProperty('--accent',(cats[b.c]||cats.frame).color);const head=make('div','group-head');head.append(make('span','dot'),make('span','mono',b.s),make('span','',b.t));group.append(head);
  if(!b.tasks.length)group.append(make('p','empty','No tasks yet.'));
  b.tasks.forEach(t=>{total++;const label=make('label','task'),check=make('input');check.type='checkbox';check.checked=!!completed[doneKey(t.id)];if(check.checked)done++;check.onchange=()=>{completed[doneKey(t.id)]=check.checked;persist();updateProgress()};label.append(check,make('span','',t.text));group.append(label)});
  const form=make('form','add-task'),input=make('input');input.placeholder='Add task';input.setAttribute('aria-label','Add task to '+b.t+' at '+b.s);input.maxLength=250;const button=make('button','','+');button.setAttribute('aria-label','Add task');form.append(input,button);form.onsubmit=e=>{e.preventDefault();if(!input.value.trim())return;b.tasks.push({id:crypto.randomUUID(),text:input.value.trim()});persist();render()};group.append(form);$('checklist').append(group);
 });$('progress').textContent=done+' / '+total;requestAnimationFrame(layoutCards);
}
function updateProgress(){const checks=[...document.querySelectorAll('.task input')];$('progress').textContent=checks.filter(x=>x.checked).length+' / '+checks.length}
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
function show(){$('board').hidden=false;$('shade').hidden=false;render()}
function hide(){$('board').hidden=true;$('shade').hidden=true;layoutCards()}
function setDim(){document.documentElement.style.setProperty('--dim',Number($('dim').value)/100)}
function tab(name){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));$('tab-general').hidden=name!=='general';$('tab-background').hidden=name!=='background'}
function openSettings(name='general'){tab(name);renderCardManager();$('settings').showModal()}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('settings-open').onclick=()=>openSettings();$('cards-open').onclick=()=>openSettings('background');$('dim').oninput=()=>{setDim();persist()};$('reminder').onchange=()=>{persist();$('reminder-label').textContent=$('reminder').value};

function renderWeek(){const {start,end}=range(),px=35;$('week-head').replaceChildren(make('span'));days.forEach((d,i)=>{const n=make('span',dateKey(shownDate(d))===dateKey(new Date())?'today':'',short[i]);$('week-head').append(n)});$('week-grid').replaceChildren();const axis=make('div','week-axis');axis.style.height=(end-start)/60*px+'px';addHours(axis,start,end,px);$('week-grid').append(axis);days.forEach(d=>{const col=make('div','week-column');col.style.height=(end-start)/60*px+'px';addHours(col,start,end,px,false);schedule[d].forEach(b=>col.append(event(b,start,px,()=>{day=d;$('week').close();render();requestAnimationFrame(()=>document.querySelector('#timeline .event[title="'+CSS.escape(b.s+'–'+b.e+' · '+b.t)+'"]')?.scrollIntoView({block:'center'}))})));$('week-grid').append(col)})}

$('edit-open').onclick=()=>{draft=structuredClone(schedule[day]);$('editor-title').textContent=names[days.indexOf(day)];renderEditor();$('editor').showModal()};
function renderEditor(){$('editrows').replaceChildren();draft.forEach((b,i)=>{const row=make('div','edit-block'),fields=make('div','edit-fields');for(const f of ['s','e','t']){const input=make('input',f==='t'?'edit-title':'');input.type=f==='t'?'text':'time';input.required=true;input.value=b[f];input.setAttribute('aria-label',({s:'Start time',e:'End time',t:'Title'})[f]);input.oninput=()=>b[f]=input.value;fields.append(input)}const del=make('button','delete','Remove');del.type='button';del.onclick=()=>{draft.splice(i,1);renderEditor()};fields.append(del);const category=make('select');category.setAttribute('aria-label','Category');Object.entries(cats).forEach(([value,c])=>{const option=make('option','',c.label);option.value=value;category.append(option)});category.value=b.c;category.onchange=()=>b.c=category.value;const area=make('textarea');area.placeholder='One task per line';area.setAttribute('aria-label','Tasks');area.value=b.tasks.map(t=>t.text).join('\n');area.oninput=()=>b.tasks=area.value.split('\n').map(x=>x.trim()).filter(Boolean).map(text=>({id:b.tasks.find(t=>t.text===text)?.id||crypto.randomUUID(),text}));row.append(fields,category,area);$('editrows').append(row)})}
$('add-block').onclick=()=>{draft.push({id:crypto.randomUUID(),s:'08:00',e:'09:00',c:'work',t:'New block',tasks:[]});renderEditor()};$('editor-form').onsubmit=e=>{e.preventDefault();if(draft.some(b=>b.s>=b.e)){toast('End time must be after start time.');return}const sorted=[...draft].sort((a,b)=>a.s.localeCompare(b.s));if(sorted.some((b,i)=>i&&sorted[i-1].e>b.s)){toast('Time blocks must not overlap.');return}schedule[day]=sorted;persist();$('editor').close();render()};
function renderCardManager(){$('card-count').textContent=cards.length+' cards';$('card-manager').replaceChildren();cards.forEach(c=>{const box=make('div','managed');if(c.type==='image'){const img=make('img');img.src=c.src;img.alt=c.name||'Background image';box.append(img)}else{const area=make('textarea');area.value=c.text;area.setAttribute('aria-label','Card text');area.oninput=()=>{c.text=area.value;persist();layoutCards()};box.append(area)}const row=make('div','row'),del=make('button','delete','Remove');del.onclick=()=>{cards=cards.filter(x=>x.id!==c.id);persist();renderCardManager();layoutCards()};row.append(make('small','',c.type==='image'?'Image':'Text'),del);box.append(row);$('card-manager').append(box)})}
$('add-text').onclick=()=>{const text=$('new-card').value.trim();if(!text)return;cards.push({id:crypto.randomUUID(),type:'text',text,color:['#dbdecc','#c5d0c8','#d9ccb9'][cards.length%3]});persist();$('new-card').value='';renderCardManager();layoutCards()};
$('images').onchange=async()=>{for(const file of $('images').files){if(!file.type.startsWith('image/'))continue;if(file.size>2*1024*1024){toast('Use images smaller than 2 MB for this local preview.');continue}const src=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)}).catch(()=>null);if(!src){toast('Could not read this image.');continue}const card={id:crypto.randomUUID(),type:'image',src,name:file.name};cards.push(card);if(!persist())cards.pop()}$('images').value='';renderCardManager();layoutCards()};
$('shuffle').onclick=()=>{layoutSeed++;persist();layoutCards()};
function rng(seed){let h=2166136261;for(const ch of String(seed))h=Math.imul(h^ch.charCodeAt(0),16777619);return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return(h>>>0)/4294967296}}
function layoutCards(){
 const W=innerWidth,H=innerHeight,p=12,gap=18,controls=document.querySelector('.controls').getBoundingClientRect(),bottom=controls.top-12,visible=!$('board').hidden,r=$('board').getBoundingClientRect();
 const regions=visible?[{x:p,y:p,w:W-2*p,h:r.top-gap-p},{x:p,y:r.bottom+gap,w:W-2*p,h:bottom-r.bottom-gap},{x:p,y:r.top,w:r.left-gap-p,h:r.height},{x:r.right+gap,y:r.top,w:W-r.right-gap-p,h:r.height}]:[{x:p,y:p,w:W-2*p,h:bottom-p}];
 const areas=regions.filter(a=>a.w>8&&a.h>8),area=areas.reduce((s,a)=>s+a.w*a.h,0);$('cards').replaceChildren();if(!cards.length||!area)return;
 const counts=areas.map(a=>Math.floor(cards.length*a.w*a.h/area));let left=cards.length-counts.reduce((a,b)=>a+b,0);const order=areas.map((a,i)=>({i,rem:cards.length*a.w*a.h/area-counts[i]})).sort((a,b)=>b.rem-a.rem);for(let i=0;i<left;i++)counts[order[i%order.length].i]++;
 const random=rng(layoutSeed),shuffled=[...cards].sort((a,b)=>a.id.localeCompare(b.id));for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}let index=0;
 areas.forEach((a,k)=>{const count=counts[k];if(!count)return;let best={score:0};for(let cols=1;cols<=count;cols++){const rows=Math.ceil(count/cols),cw=a.w/cols,ch=a.h/rows,score=Math.min(cw,ch*1.35);if(score>best.score)best={cols,rows,cw,ch,score}}for(let j=0;j<count;j++){
  const c=shuffled[index++],rand=rng(c.id+layoutSeed),theta=(rand()-.5)*.2,cos=Math.abs(Math.cos(theta)),sin=Math.abs(Math.sin(theta));let w=Math.min(best.cw*.86,260),h=w/(c.type==='image'?1.2:1.35);const scale=Math.min(1,best.cw*.9/(w*cos+h*sin),best.ch*.9/(w*sin+h*cos));w*=scale;h*=scale;const bw=w*cos+h*sin,bh=w*sin+h*cos,cx=a.x+(j%best.cols+.5)*best.cw+(rand()-.5)*(best.cw-bw)*.45,cy=a.y+(Math.floor(j/best.cols)+.5)*best.ch+(rand()-.5)*(best.ch-bh)*.45;
  const n=make('div','bg-card '+c.type);n.dataset.cardId=c.id;n.style.cssText='left:'+(cx-w/2)+'px;top:'+(cy-h/2)+'px;width:'+w+'px;height:'+h+'px;transform:rotate('+theta+'rad);';if(c.type==='image'){const img=make('img');img.src=c.src;img.alt='';n.append(img)}else{n.style.background=c.color||'#dbdecc';n.style.padding=Math.min(14,w*.075)+'px';const text=make('span','',c.text);n.append(text);let size=Math.min(17,w*.085);text.style.fontSize=size+'px';$('cards').append(n);while((text.scrollHeight>n.clientHeight-parseFloat(n.style.padding)*2||text.scrollWidth>n.clientWidth)&&size>2){size-=.5;text.style.fontSize=size+'px'}}if(!n.isConnected)$('cards').append(n);
 }});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('dialog[open]'))hide()});window.addEventListener('resize',()=>requestAnimationFrame(layoutCards));new ResizeObserver(()=>requestAnimationFrame(layoutCards)).observe($('board'));setDim();render();
</script>

<script>
